<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="profile-card">
             <center><img class="photo" src="images/68219010001.jpg" alt="รูปโปรไฟล์"></center>
       <h1>My Profile</h1> 
      <p>ชื่อ-นามสกุล: <span id="fullname">กนกวรรณ ประสารทอง</span></p>
      <p>ชื่อเล่น: <span id="nickname">ข้าวฟ่าง</span></p>
      <p>รหัสประจำตัว: <span id="studentID">68219010001</span></p>

      <div class="motto">
        <h2>คติประจำใจ</h2>
        <p id="motto">คาดหวังอะไรไว้ ก็คาดหวังต่อไป</p>
      </div>

      <button id="greetingBtn" class="greetingBtn">ทักทาย</button>
      <p id="greetingMessage" class="greetingMessage">สวัสดีค่ะ</p>
    </main>
  </body>
</html>
